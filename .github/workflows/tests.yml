# Runs the Playwright tests on every push and pull request.
name: Playwright tests

# WHEN does this run?
on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  test:
    # WHERE does it run? A fresh Ubuntu machine from GitHub.
    runs-on: ubuntu-latest

    # WHAT does it do? Steps run top to bottom. If one fails, the rest stop
    # (unless they say `if: failure()` or `if: always()`).
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium (and the Linux libraries it needs)
        run: python -m playwright install --with-deps chromium

      - name: Run the tests
        # Keep a screenshot and a trace ONLY for tests that fail.
        run: pytest -v --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results

      - name: Upload screenshots and traces
        # Only runs when an earlier step failed, so green runs stay clean.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
